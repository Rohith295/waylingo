[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Smaller, faster libraries for apps. Unwinding stays on: the bindings turn a panic
# into an error instead of aborting the host app.
[profile.release]
lto = true
codegen-units = 1
# Keep the symbol table: uniffi-bindgen reads the binding metadata from it, and
# on Linux a full strip removes it ("No UniFFI metadata found").
strip = "debuginfo"
