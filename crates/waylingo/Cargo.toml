[package]
name = "waylingo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Natural-language stop planning along routes: query in, GeoJSON out. Sans-IO engine."

[lints]
workspace = true

[dependencies]
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11"
thiserror = "2.0.21"
waylingo-geo = { version = "0.1.1", path = "../waylingo-geo" }
waylingo-http = { version = "0.1.1", path = "../waylingo-http" }
waylingo-parse = { version = "0.1.1", path = "../waylingo-parse" }
waylingo-plan = { version = "0.1.1", path = "../waylingo-plan" }
waylingo-providers = { version = "0.1.1", path = "../waylingo-providers" }

[dev-dependencies]
serde_json = "1.0.154"
