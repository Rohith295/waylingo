[package]
name = "waylingo-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Map provider adapters for Waylingo: pure request builders and response parsers. Never depends on the LLM crate."

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
waylingo-geo = { version = "0.1.1", path = "../waylingo-geo" }
waylingo-http = { version = "0.1.1", path = "../waylingo-http" }
waylingo-plan = { version = "0.1.1", path = "../waylingo-plan" }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["blocking"] }
