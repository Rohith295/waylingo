[package]
name = "waylingo-reqwest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Blocking and async reqwest hosts for the Waylingo engine."

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync"] }
waylingo = { version = "0.1.1", path = "../waylingo" }
webpki-root-certs = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "time"] }
waylingo-parse = { version = "0.1.1", path = "../waylingo-parse" }
waylingo-plan = { version = "0.1.1", path = "../waylingo-plan" }

[features]
# Trust Mozilla's root certificates (bundled) instead of the operating system's
# verifier. Needed on Android, where the platform verifier requires app-context
# set-up over JNI; harmless elsewhere.
bundled-roots = ["dep:webpki-root-certs"]
