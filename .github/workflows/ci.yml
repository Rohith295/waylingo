# Every push and pull request: Rust tests and lints, the Python wheel, and the
# Kotlin bindings compiled and tested on the JVM. No secrets, no network tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/check_deps.sh
        if: runner.os != 'Windows'

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install the wheel
        working-directory: crates/waylingo-ffi
        run: |
          python -m venv .venv
          .venv/bin/pip install "maturin>=1.9,<2"
          .venv/bin/maturin build --release --out dist
          .venv/bin/pip install dist/*.whl
      - name: Offline checks
        working-directory: crates/waylingo-ffi
        run: .venv/bin/python tests/python/test_offline.py

  kotlin-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build the library and generate the Kotlin bindings
        run: |
          cargo build -p waylingo-ffi --release
          cargo run -p waylingo-ffi --features bindgen --bin uniffi-bindgen -- generate \
            --library target/release/libwaylingo_ffi.so --language kotlin --no-format \
            --out-dir crates/waylingo-ffi/tests/kotlin-jvm/src/main/kotlin
      - name: Compile and test on the JVM
        working-directory: crates/waylingo-ffi/tests/kotlin-jvm
        run: gradle test -Djna.library.path="$GITHUB_WORKSPACE/target/release"
